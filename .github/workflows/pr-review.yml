name: Protocol Reviewer

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Institutional PR Audit
    if: (github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)) && github.actor != 'bbkenny' && !contains(github.actor, 'bot')
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.MAINTAINER_TOKEN != '' && secrets.MAINTAINER_TOKEN || secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event.issue.number }}
      AUTHOR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.user.login || github.event.comment.user.login }}
    steps:
      - name: ❌ Check for Workflow Tampering
        run: |
          AUTHOR_ROLE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER -q .author_association)
          if [[ "$AUTHOR_ROLE" != "OWNER" && "$AUTHOR_ROLE" != "MEMBER" && "$AUTHOR_ROLE" != "COLLABORATOR" ]]; then
            CHANGED_FILES=$(gh pr view $PR_NUMBER --json files -q '.files[].path')
            if echo "$CHANGED_FILES" | grep -q "^.github/"; then
              gh pr comment $PR_NUMBER --body "🚨 **SECURITY ALERT**: External contributors are not permitted to modify files in the \`.github/\` directory. Please revert these changes to proceed."
              gh pr close $PR_NUMBER
              exit 1
            fi
            if echo "$CHANGED_FILES" | grep -q "^\.gitignore"; then
              gh pr comment $PR_NUMBER --body "🚨 **SECURITY ALERT**: External contributors are not permitted to modify \`.gitignore\` to prevent accidental exposure of environment/deployment secrets. Please revert these changes to proceed."
              gh pr close $PR_NUMBER
              exit 1
            fi
          fi

      - name: 🔍 Check for Issue Link
        run: |
          PR_BODY=$(gh pr view $PR_NUMBER --json body -q .body)
          if ! echo "$PR_BODY" | grep -Eiq "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) #[0-9]+"; then
            RESPONSES=(
              "hey @${{ env.AUTHOR }}! i noticed you didn't link an issue in your PR description. please add \`Closes #ISSUE_NUMBER\` so we can close it when merged!"
              "Thanks for the PR @${{ env.AUTHOR }}! Could you please link the issue it resolves using \`Closes #ISSUE_NUMBER\` in the description? It helps us track things better."
              "Hey @${{ env.AUTHOR }}, looks like the PR description is missing an issue link. Just drop a \`Closes #123\` in there so we can link them up!"
              "Awesome start @${{ env.AUTHOR }}, but could you add a closing keyword like \`Closes #ISSUE\` to the PR body? That way GitHub will close the issue for us."
              "I'd love to review this @${{ env.AUTHOR }}, but we need an issue linked first! Please update the description with \`Closes #ISSUE_NUMBER\`."
              "Hey @${{ env.AUTHOR }}, before we proceed, please link the related issue in the description (e.g., \`Fixes #41\`). Thanks!"
            )
            SELECTED=$(shuf -n1 -e "${RESPONSES[@]}")
            gh pr comment $PR_NUMBER --body "$SELECTED"
            exit 1
          fi

      - name: 👥 Assignment Gate (Issue must be assigned to PR author)
        run: |
          PR_BODY=$(gh pr view $PR_NUMBER --json body -q .body)
          ISSUE_NUM=$(echo "$PR_BODY" | grep -oEi "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) #[0-9]+" | head -n1 | grep -oE "[0-9]+")

          if ! gh issue view "$ISSUE_NUM" --json state,title,assignees > /tmp/issue.json 2>/dev/null; then
            gh pr review $PR_NUMBER --request-changes -b "hey @${{ env.AUTHOR }}, i couldn't find the linked issue #$ISSUE_NUM. please double-check the issue number in the PR description."
            exit 1
          fi

          STATE=$(jq -r .state /tmp/issue.json)
          if [ "$STATE" != "OPEN" ]; then
            gh pr review $PR_NUMBER --request-changes -b "hey @${{ env.AUTHOR }}, the linked issue #$ISSUE_NUM is \`$STATE\`. please reopen it or link an open issue so we can proceed."
            exit 1
          fi

          ASSIGNEES=$(jq -r '[.assignees[].login] | join(",")' /tmp/issue.json)
          if [ -z "$ASSIGNEES" ]; then
            gh pr review $PR_NUMBER --request-changes -b "hey @${{ env.AUTHOR }}, issue #$ISSUE_NUM isn't assigned to anyone yet. please get yourself assigned to the issue before submitting work."
            exit 1
          fi

          if ! echo ",$ASSIGNEES," | grep -q ",${{ env.AUTHOR }},"; then
            gh pr review $PR_NUMBER --request-changes -b "hey @${{ env.AUTHOR }}, issue #$ISSUE_NUM is assigned to \`$ASSIGNEES\` but not to you. only the assigned contributor can have work merged for this issue."
            exit 1
          fi

          echo "✅ Assignment verified: issue #$ISSUE_NUM is assigned to @${{ env.AUTHOR }}."

      - name: 🚨 Check for Merge Conflicts
        run: |
          MERGEABLE=$(gh pr view $PR_NUMBER --json mergeable -q .mergeable)
          if [ "$MERGEABLE" == "CONFLICTING" ]; then
            RESPONSES=(
              "hey @${{ env.AUTHOR }}, it looks like there are merge conflicts with the \`main\` branch. could you pull the latest changes and resolve them so i can run my tests?"
              "Hi @${{ env.AUTHOR }}! This PR currently has merge conflicts with \`main\`. Please rebase or merge the latest changes so we can proceed with the review."
              "Looks like some conflicts popped up with the base branch @${{ env.AUTHOR }}! Once you resolve them, the checks will kick off again."
              "Hey @${{ env.AUTHOR }}, we can't merge this yet because of conflicts with \`main\`. Mind taking a look and fixing them up?"
              "Merge conflicts detected @${{ env.AUTHOR }}! Please sync your branch with \`main\` and resolve the conflicts so we can get this reviewed."
              "HI @${{ env.AUTHOR }}, looks like someone else merged changes that conflict with yours. Please resolve the conflicts and push an update!"
            )
            SELECTED=$(shuf -n1 -e "${RESPONSES[@]}")
            gh pr comment $PR_NUMBER --body "$SELECTED"
            exit 1
          fi

      - name: 🕓 Already-Reviewed SHA Check (dedupe)
        run: |
          HEAD_SHA=$(gh pr view $PR_NUMBER --json headRefOid -q .headRefOid)
          LAST_REVIEW_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --jq '[.[] | select(.user.login == "bbkenny")] | last | .commit_id // ""' 2>/dev/null || echo "")
          if [ -n "$LAST_REVIEW_SHA" ] && [ "$LAST_REVIEW_SHA" = "$HEAD_SHA" ]; then
            echo "🕓 Bot already reviewed head SHA $HEAD_SHA. Skipping re-review (no new commits)."
            echo "SKIP_REVIEW=true" >> "$GITHUB_ENV"
          else
            echo "🕓 Head SHA $HEAD_SHA not reviewed yet. Proceeding with review."
            echo "SKIP_REVIEW=false" >> "$GITHUB_ENV"
          fi